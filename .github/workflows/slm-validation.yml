name: ChargeUp Palo Alto SLM Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/slm-validation.yml'

permissions:
  contents: write

concurrency:
  group: chargeup-paloalto-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and prepare real Palo Alto data
        run: python -m src.palo_alto_data --download
      - name: Run SLM Weeks 3 to 11 on real data
        run: |
          python -m src.week03_linear_regression --no-mlflow
          python -m src.week04_regularized_models
          python -m src.week05_cv_selection
          python -m src.week06_decision_tree
          python -m src.week07_random_forest
          python -m src.week08_xgboost_shap
          python -m src.week09_station_clustering
          python -m src.week10_nested_validation
          python -m src.week11_package_champion
      - name: Test Week 12 FastAPI
        run: python -m pytest -q
      - name: Upload real-data validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: chargeup-paloalto-validation
          path: |
            reports/
            data/processed/palo_alto_hourly_sample.csv
            models/registry/chargeup-paloalto-v2.0.0/
          if-no-files-found: error
      - name: Commit compact real-data reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/processed/palo_alto_hourly_sample.csv models/week09_station_segments.json models/registry/chargeup-paloalto-v2.0.0
          git reset -- reports/week03_test_predictions.csv || true
          git diff --cached --quiet && exit 0
          git commit -m "data: record Palo Alto real-data validation [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
